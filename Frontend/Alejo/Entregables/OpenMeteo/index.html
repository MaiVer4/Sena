<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard Clima</title>
</head>

<body>

    <main class="container">
        <h1>Dashboard Del Clima</h1>

        <form id="weather-form">
            <input type="text" id="cityName" placeholder="Ingresa la ciudad a consultar" required>
            <button type="submit" id="buttonForm">Buscar</button>
        </form>
        <div id="loading-spinner" class="spinner-container" style="display: none;">
            <div class="spinner"></div>
            <p>consultando Clima...</p>
        </div>
        <div id="result-container"></div>
    </main>

</body>
<script type="module" src="/main.js"></script>

</html>
