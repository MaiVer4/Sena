<button (click)="manejarClick()">
  {{items.length > 0 ? 'Borrar' : 'Cargar' }}
</button>

@if (estadoActual === 'CARGANDO') {
  <p>⏳ Cargando elementos...</p>
}

@if (estadoActual === 'PENDIENTE') {
  <p>Elementos Pendientes</p>
}

@if (estadoActual === 'EXITO') {
  <p>Elementos Cargados Con Exito!</p>
  <ul>
    @for (item of items; track item) {
      <li>{{ item }}</li>
    }
  </ul>
}
